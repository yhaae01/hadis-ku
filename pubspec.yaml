name: hadis_ku
description: "HadisKu — aplikasi pencarian dan pembacaan hadis dengan terjemahan Indonesia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# Splash screen (jalankan: dart run flutter_native_splash:create)
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0B5D3B"
  color_dark: "#062E1D"
  image: assets/icon/splash-logo.png
  image_dark: assets/icon/splash-logo.png
  android: true
  ios: true
  web: true

  android_12:
    color: "#0B5D3B"
    color_dark: "#062E1D"
    image: assets/icon/splash-logo.png
    icon_background_color: "#0B5D3B"
    icon_background_color_dark: "#062E1D"

# ---------------------------------------------------------------------------
# App icon (jalankan: dart run flutter_launcher_icons)
# ---------------------------------------------------------------------------
# Ikon sumber yang diberikan berbentuk banner landscape (2816x1536), sehingga
# varian persegi diturunkan darinya lewat tool/generate_brand_assets.dart.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-app.jpeg"
  image_path_android: "assets/icon/icon-app-solid.png"
  image_path_ios: "assets/icon/icon-app-solid.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B5D3B"
  adaptive_icon_foreground: "assets/icon/icon-adaptive-foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon-app-solid.png"
    background_color: "#0B5D3B"
    theme_color: "#0B5D3B"
  windows:
    generate: true
    image_path: "assets/icon/icon-app-solid.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon-app-solid.png"
